name: Send feedback
description: Tell us what you like, what feels off, or how a board played.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Every note is read. Difficulty ratings in particular are tuned from player feedback, so telling us a Hard board felt easy (or the reverse) is useful.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Difficulty felt wrong
        - Hints
        - Controls (tapping, dragging, dots)
        - Look and feel
        - Accessibility
        - Something else
  - type: input
    id: board
    attributes:
      label: Board, if it is about one
      placeholder: 2 stars, 10×10, Hard
